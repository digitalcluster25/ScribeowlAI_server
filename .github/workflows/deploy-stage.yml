name: Stage API

on:
  pull_request:
    branches: [stage]
  push:
    branches: [stage]
  workflow_dispatch:

concurrency:
  group: stage-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run API tests
        run: docker build --target test .
      - name: Build API image
        run: docker build -t scribeowl-api:stage .
      - name: Install Supabase CLI
        if: github.ref == 'refs/heads/stage' && github.event_name != 'pull_request'
        uses: supabase/setup-cli@v1.7.3
        with:
          version: 2.118.0
      - name: Apply database migrations
        if: github.ref == 'refs/heads/stage' && github.event_name != 'pull_request'
        env:
          STAGE_SUPABASE_DB_URL: ${{ secrets.STAGE_SUPABASE_DB_URL }}
        run: |
          test -n "$STAGE_SUPABASE_DB_URL"
          supabase db push --db-url "$STAGE_SUPABASE_DB_URL" --yes
      - name: Package image
        if: github.ref == 'refs/heads/stage' && github.event_name != 'pull_request'
        run: docker save scribeowl-api:stage | gzip -1 > scribeowl-api-stage.tar.gz
      - name: Configure SSH
        if: github.ref == 'refs/heads/stage' && github.event_name != 'pull_request'
        env:
          DEPLOY_KEY: ${{ secrets.STAGE_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGE_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy to VPS
        if: github.ref == 'refs/heads/stage' && github.event_name != 'pull_request'
        run: |
          ssh root@69.62.121.157 'test -s /opt/scribeowl-api/server.env && grep -q "^SUPABASE_URL=." /opt/scribeowl-api/server.env && grep -q "^SUPABASE_SERVICE_ROLE_KEY=." /opt/scribeowl-api/server.env'
          scp scribeowl-api-stage.tar.gz deploy/compose.stage.yml root@69.62.121.157:/opt/scribeowl-api/
          ssh root@69.62.121.157 'docker load -i /opt/scribeowl-api/scribeowl-api-stage.tar.gz && docker compose -p scribeowl-api -f /opt/scribeowl-api/compose.stage.yml up -d --force-recreate && rm /opt/scribeowl-api/scribeowl-api-stage.tar.gz'
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error https://scribe-api.spaces.community/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1
